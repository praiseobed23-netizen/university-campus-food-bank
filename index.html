<section id="request-food">
  <h2>Request Food</h2>
  <p>Need food support? Please fill out the form below. Your information will be kept confidential.</p>

  <form action="https://formspree.io/f/xaeyejgn" method="POST">

    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="Enter your full name" required>

    <label for="email">Email Address</label>
    <input type="email" id="email" name="email" placeholder="Enter your email" required>

    <label for="phone">Phone Number</label>
    <input type="tel" id="phone" name="phone" placeholder="Enter your phone number">

    <label for="student-id">Student ID</label>
    <input type="text" id="student-id" name="student_id" placeholder="Enter your student ID">

    <label for="food-type">Type of Food Support Needed</label>
    <select id="food-type" name="food_type" required>
      <option value="">Select an option</option>
      <option value="food package">Food Package</option>
      <option value="emergency food">Emergency Food Support</option>
      <option value="other">Other</option>
    </select>

    <label for="message">Tell us what you need</label>
    <textarea id="message" name="message" rows="5"
      placeholder="Please briefly describe your food needs" required></textarea>

    <button type="submit">Submit Food Request</button>

  </form>
</section>
